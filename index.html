<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaaStinxx - Jahon Kinolari Barchasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e50914;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #e50914;
            letter-spacing: 1px;
            cursor: pointer;
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        .search-box input {
            padding: 10px 15px;
            width: 320px;
            border-radius: 5px;
            border: none;
            outline: none;
            background-color: #2b2b2b;
            color: white;
            font-size: 16px;
        }
        .search-box button {
            padding: 10px 20px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .search-box button:hover {
            background-color: #b20710;
        }
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }
        h2 {
            margin-bottom: 20px;
            border-left: 4px solid #e50914;
            padding-left: 10px;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .movie-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .movie-card:hover {
            transform: translateY(-5px);
        }
        .movie-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }
        .movie-info {
            padding: 15px;
        }
        .movie-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-meta {
            font-size: 13px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            color: #aaa;
            font-size: 18px;
            padding: 30px;
        }

        /* BaaStinxx Modal Oynasi va Pleer */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            overflow-y: auto;
            padding: 20px;
        }
        .modal-content {
            background-color: #1a1a1a;
            margin: 30px auto;
            max-width: 900px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.9);
            position: relative;
        }
        .close-btn {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
            z-index: 10;
        }
        .close-btn:hover {
            color: #e50914;
        }
        .modal-body {
            padding: 30px;
        }
        .modal-title {
            font-size: 24px;
            margin-bottom: 10px;
            color: #e50914;
        }
        .modal-details {
            font-size: 14px;
            color: #ffcc00;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .modal-overview {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .baastinxx-player {
            width: 100%;
            height: 450px;
            background-color: #000;
            border-radius: 5px;
            outline: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.reload()">BaaStinxx</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Minglab kinolardan qidirish...">
            <button onclick="searchMovies()">Qidirish</button>
        </div>
    </header>

    <div class="container">
        <h2 id="sectionTitle">BaaStinxx - Barcha Jahon Kinolari</h2>
        <div class="movies-grid" id="movieList">
            <div class="loading">Kinolar yuklanmoqda... iltimos kuting.</div>
        </div>
    </div>

    <!-- BaaStinxx Kino Ko'rish Oynasi -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                <h2 class="modal-title" id="modalTitle">Kino Nomi</h2>
                <div class="modal-details" id="modalDetails">Davomiyligi: yuklanmoqda...</div>
                <p class="modal-overview" id="modalOverview">Kino haqida tavsif...</p>
                
                <!-- BaaStinxx Sof Video Pleeri -->
                <video id="baastinxxPlayer" class="baastinxx-player" controls>
                    <source src="" type="video/mp4">
                    Sizning brauzeringiz videoni qo'llab-quvvatlamaydi.
                </video>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '3fd2be6f0c70a2a598f084ddfb75487c'; 
        // Ko'proq kinolar chiqishi uchun bir nechta sahifadagi ma'lumotlarni birlashtiramiz
        const API_URL = `https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}&page=1`;
        const SEARCH_URL = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=`;

        const movieList = document.getElementById('movieList');
        const searchInput = document.getElementById('searchInput');
        const sectionTitle = document.getElementById('sectionTitle');
        const movieModal = document.getElementById('movieModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDetails = document.getElementById('modalDetails');
        const modalOverview = document.getElementById('modalOverview');
        const baastinxxPlayer = document.getElementById('baastinxxPlayer');

        loadInitialMovies();

        async function loadInitialMovies() {
            try {
                // 1 va 2-sahifadagi kinolarni birga yuklab, kinolar sonini ko'paytiramiz
                const res1 = await fetch(`https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}&page=1`);
                const data1 = await res1.json();
                
                const res2 = await fetch(`https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=${API_KEY}&page=2`);
                const data2 = await res2.json();

                const allMovies = [...data1.results, ...data2.results];
                showMovies(allMovies);
            } catch (error) {
                movieList.innerHTML = '<div class="loading">Kinolarni yuklashda xatolik yuz berdi. Internet aloqasini tekshiring.</div>';
            }
        }

        async function getMovies(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                showMovies(data.results);
            } catch (error) {
                movieList.innerHTML = '<div class="loading">Kinolarni yuklashda xatolik yuz berdi.</div>';
            }
        }

        function showMovies(movies) {
            movieList.innerHTML = '';

            if (!movies || movies.length === 0) {
                movieList.innerHTML = '<div class="loading">Bunday kino topilmadi. Boshqa nom bilan qidirib koʻring.</div>';
                return;
            }

            movies.forEach(movie => {
                const { id, title, poster_path, release_date } = movie;
                const poster = poster_path ? `https://image.tmdb.org/t/p/w500${poster_path}` : 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500';
                const year = release_date ? release_date.split('-')[0] : 'Nomaʼlum';

                const card = document.createElement('div');
                card.classList.add('movie-card');
                
                // Har bir kinoning ustiga bosganda ishlaydigan qilib to'g'irlandi
                card.onclick = () => openMovieDetails(id, title);

                card.innerHTML = `
                    <img src="${poster}" alt="${title}">
                    <div class="movie-info">
                        <div class="movie-title">${title}</div>
                        <div class="movie-meta">
                            <span>Chiqgan yili</span>
                            <span>${year}</span>
                        </div>
                    </div>
                `;
                movieList.appendChild(card);
            });
        }

        async function openMovieDetails(movieId, title) {
            modalTitle.innerText = title;
            modalDetails.innerText = "Davomiyligi yuklanmoqda...";
            modalOverview.innerText = "Tavsif yuklanmoqda...";
            baastinxxPlayer.src = "";
            movieModal.style.display = 'block';

            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${movieId}?api_key=${API_KEY}`);
                const movie = await res.json();

                // To'liq vaqtini hisoblash (Soat va daqiqa)
                const runtime = movie.runtime ? `${Math.floor(movie.runtime / 60)} soat ${movie.runtime % 60} daqiqa` : "2 soat 00 daqiqa";
                
                modalDetails.innerText = `Davomiyligi: ${runtime} | Janri: ${movie.genres ? movie.genres.map(g => g.name).join(', ') : 'Jahon kinolari'}`;
                modalOverview.innerText = movie.overview ? movie.overview : "Bu kino haqida hozircha tavsif kiritilmagan.";
                
                // Bu yerga o'z video faylingiz (mp4) havolasini qo'shishingiz mumkin
                baastinxxPlayer.src = ""; 
            } catch (error) {
                modalDetails.innerText = "Davomiyligi: 2 soat 00 daqiqa";
                modalOverview.innerText = "Ma'lumotni yuklab bo'lmadi.";
            }
        }

        function closeModal() {
            movieModal.style.display = 'none';
            baastinxxPlayer.pause();
            baastinxxPlayer.src = '';
        }

        window.onclick = function(event) {
            if (event.target == movieModal) {
                closeModal();
            }
        }

        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchMovies();
            }
        });

        function searchMovies() {
            const searchTerm = searchInput.value.trim();
            if (searchTerm !== '') {
                sectionTitle.innerText = `Qidiruv natijasi: "${searchTerm}"`;
                getMovies(SEARCH_URL + encodeURIComponent(searchTerm));
            } else {
                sectionTitle.innerText = 'BaaStinxx - Barcha Jahon Kinolari';
                loadInitialMovies();
            }
        }
    </script>

</body>
</html>
